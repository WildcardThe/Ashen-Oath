<title>Ashen Oath</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&family=Cinzel:wght@600;800&family=Barlow+Condensed:wght@400;500;600;700&display=swap">
<style>
/* Layout: full-height war-table — map stage on the left, brass-trimmed command panel on the right; overlays for towns and battle. */
:root {
  --soot: #0d0b0a;
  --iron: #171412;
  --iron-2: #201c19;
  --iron-3: #2a2521;
  --line: #3b332c;
  --bone: #ece3d2;
  --ash: #a3978a;
  --brass: #c9a24a;
  --brass-hi: #ecc96e;
  --blood: #b2372c;
  --ok: #86c06a;
  --f-display: 'Cinzel', 'Trajan Pro', Georgia, serif;
  --f-ui: 'Barlow Condensed', 'Arial Narrow', 'Roboto Condensed', sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--soot); color: var(--bone); font-family: var(--f-ui); font-size: 16px; line-height: 1.35;
  overflow: hidden; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0;
}
button { font: inherit; color: inherit; }
img { image-rendering: auto; }
.muted { color: var(--ash); }
.mono { font-variant-numeric: tabular-nums; color: var(--ash); font-size: 14px; }
.warn { color: #f0a050; }
.t0 { color: #9fd08a; } .t1 { color: #c8d07a; } .t2 { color: #e8c86a; } .t3 { color: #f08a50; } .t4 { color: #ff5a4a; font-weight: 700; }
#app { height: 100%; display: flex; flex-direction: column; }

.btn {
  background: var(--iron-2); border: 1px solid var(--line); border-radius: 3px; padding: 7px 14px; cursor: pointer;
  letter-spacing: 0.04em; text-transform: uppercase; font-weight: 600; font-size: 15px; transition: border-color .15s, background .15s;
}
.btn:hover:not(:disabled) { border-color: var(--brass); }
.btn:focus-visible, .slot:focus-visible, .fcard:focus-visible, .hl:focus-visible, .tl:focus-visible { outline: 2px solid var(--brass-hi); outline-offset: 2px; }
.btn.primary { background: linear-gradient(#d7b157, #a9842f); color: #1a1208; border-color: #e6c46e; }
.btn.primary:hover:not(:disabled) { background: linear-gradient(#e6c46e, #b8903a); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.sm { padding: 4px 9px; font-size: 13px; }
.btn.on { border-color: var(--brass-hi); color: var(--brass-hi); }

/* ---------- title ---------- */
#title {
  flex: 1; overflow: auto; display: flex; flex-direction: column; align-items: center; gap: 24px; padding-block: 40px 32px;
  background: radial-gradient(ellipse at 50% 120%, rgba(178,55,44,.35), transparent 60%), radial-gradient(ellipse at 50% -20%, rgba(201,162,74,.12), transparent 50%);
}
.brand { text-align: center; }
.brand h1 {
  font-family: var(--f-display); font-weight: 800; font-size: clamp(44px, 9vw, 104px); letter-spacing: .12em; margin: 0; line-height: 1;
  background: linear-gradient(180deg, #f6e2a8 0%, #c9a24a 45%, #7a5a20 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
  text-shadow: 0 2px 0 rgba(0,0,0,.25); text-wrap: balance;
}
.brand p { margin: 10px 0 0; color: var(--ash); letter-spacing: .3em; text-transform: uppercase; font-size: 14px; }
#faction-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 18px; width: min(1000px, 100%); }
.fcard {
  text-align: left; background: linear-gradient(180deg, var(--iron-2), var(--iron)); border: 1px solid var(--line); border-radius: 4px;
  padding: 18px; cursor: pointer; display: flex; flex-direction: column; gap: 12px; min-width: 0;
}
.fcard.sel { border-color: var(--brass); box-shadow: 0 0 0 1px var(--brass), 0 10px 40px rgba(201,162,74,.12); }
.fcard-head { display: flex; gap: 12px; align-items: center; }
.fcard-head img { width: 64px; height: 64px; background: var(--soot); border: 1px solid var(--line); border-radius: 3px; }
.fcard h3 { font-family: var(--f-display); margin: 0; font-size: 22px; letter-spacing: .04em; }
.fcard p { margin: 0; color: var(--ash); }
.fcard .lore { color: var(--bone); font-style: italic; }
.roster { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.roster figure { margin: 0; text-align: center; min-width: 0; }
.roster img { width: 100%; max-width: 64px; background: rgba(0,0,0,.3); border-radius: 3px; }
.roster figcaption { font-size: 12px; color: var(--ash); line-height: 1.1; }
.title-actions { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
.title-actions .btn { font-size: 18px; padding: 10px 26px; }
.fineprint { color: var(--ash); font-size: 13px; max-width: 60ch; text-align: center; }

/* ---------- game ---------- */
#game { flex: 1; min-height: 0; display: grid; grid-template-rows: auto 1fr; gap: 0; padding-block: 8px; }
#topbar { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; padding: 6px 4px 10px; border-bottom: 1px solid var(--line); }
#topbar .logo { font-family: var(--f-display); font-weight: 800; letter-spacing: .14em; color: var(--brass); font-size: 18px; }
#res { display: flex; gap: 14px; flex-wrap: wrap; }
.res { display: flex; align-items: baseline; gap: 5px; font-variant-numeric: tabular-nums; }
.res b { font-size: 18px; } .res small { color: var(--ok); font-size: 13px; }
.ri { width: 18px; height: 18px; vertical-align: -3px; }
#date { display: flex; gap: 10px; color: var(--ash); text-transform: uppercase; letter-spacing: .08em; font-size: 14px; margin-left: auto; }
#topbar .tb-btns { display: flex; gap: 8px; }
#main { display: grid; grid-template-columns: 1fr 290px; gap: 12px; min-height: 0; padding-top: 10px; }
#stage { position: relative; min-width: 0; min-height: 0; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; background: #080706; }
#map { display: block; width: 100%; height: 100%; cursor: pointer; touch-action: none; }
#tip {
  position: absolute; pointer-events: none; background: rgba(13,11,10,.94); border: 1px solid var(--line); border-radius: 3px;
  padding: 6px 9px; font-size: 14px; max-width: 260px; z-index: 3;
}
#ai-banner {
  position: absolute; top: 12px; left: 50%; transform: translateX(-50%); background: rgba(13,11,10,.9); border: 1px solid var(--blood);
  color: var(--bone); padding: 6px 16px; border-radius: 3px; letter-spacing: .06em; text-transform: uppercase; z-index: 4;
}
#toasts { position: absolute; left: 12px; bottom: 12px; display: flex; flex-direction: column; gap: 6px; z-index: 4; max-width: min(420px, calc(100% - 24px)); pointer-events: none; }
.toast { background: rgba(13,11,10,.92); border-left: 3px solid var(--brass); padding: 6px 10px; font-size: 15px; transition: opacity .5s; }
.toast.bad { border-left-color: var(--blood); }
.toast.out { opacity: 0; }

#side { display: flex; flex-direction: column; gap: 12px; min-height: 0; overflow: auto; padding-right: 2px; }
#minimap { width: 100%; aspect-ratio: 1; max-width: 100%; border: 1px solid var(--line); border-radius: 3px; cursor: crosshair; display: block; }
.side-sec h3 { font-family: var(--f-display); font-size: 13px; letter-spacing: .14em; color: var(--brass); margin: 0 0 6px; text-transform: uppercase; }
#hero-card { background: var(--iron); border: 1px solid var(--line); border-radius: 4px; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
.hc-head { display: flex; gap: 10px; align-items: center; }
.hc-head img { width: 52px; height: 52px; background: var(--soot); border: 1px solid var(--line); border-radius: 3px; }
.hc-head h3 { margin: 0; font-family: var(--f-display); font-size: 16px; line-height: 1.15; }
.hc-head p { margin: 2px 0 0; color: var(--ash); font-size: 14px; font-variant-numeric: tabular-nums; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; text-align: center; }
.stats div { background: var(--iron-2); border-radius: 3px; padding: 3px 0; }
.stats small { display: block; color: var(--ash); font-size: 11px; text-transform: uppercase; letter-spacing: .05em; }
.stats b { font-size: 18px; font-variant-numeric: tabular-nums; }
.bar-old { display: grid; grid-template-columns: 64px 1fr auto; gap: 6px; align-items: center; font-size: 13px; color: var(--ash); font-variant-numeric: tabular-nums; }
.track { height: 6px; background: var(--iron-3); border-radius: 3px; overflow: hidden; }
.track i { display: block; height: 100%; background: var(--ok); }
.bar.mana .track i { background: #8a7ae8; }
.slots { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
.slot { position: relative; aspect-ratio: 1; background: var(--iron-2); border: 1px solid var(--line); border-radius: 3px; padding: 0; cursor: pointer; min-width: 0; }
.slot img { width: 100%; height: 100%; display: block; }
.slot span { position: absolute; right: 2px; bottom: 0; font-size: 12px; font-weight: 700; text-shadow: 0 1px 2px #000, 0 0 3px #000; font-variant-numeric: tabular-nums; }
.slot.empty { background: rgba(0,0,0,.25); }
.slot.picked { border-color: var(--brass-hi); box-shadow: 0 0 0 1px var(--brass-hi); }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chip { font-size: 12px; padding: 1px 7px; border-radius: 10px; border: 1px solid var(--line); }
.chip.spell { color: #c8c0ff; border-color: #4a4380; }
.chip.relic { color: var(--brass-hi); border-color: #6a5426; }
.route { margin: 0; font-size: 13px; color: var(--ash); }
.hl, .tl { width: 100%; display: grid; grid-template-columns: 30px 1fr; gap: 8px; align-items: center; text-align: left; background: var(--iron); border: 1px solid var(--line); border-radius: 3px; padding: 4px 6px; cursor: pointer; position: relative; margin-bottom: 4px; }
.hl img { width: 30px; height: 30px; }
.hl i { position: absolute; left: 0; bottom: 0; height: 2px; background: var(--ok); }
.hl.sel { border-color: var(--brass); }
.tl { grid-template-columns: 1fr auto; padding: 7px 8px; }
.tl small { color: var(--ash); }
.side-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: auto; position: sticky; bottom: 0; background: var(--soot); padding-top: 6px; }

/* ---------- overlays ---------- */
#modal-root .overlay {
  position: fixed; inset: 0; z-index: 50; background: rgba(5,4,3,.72); display: flex; align-items: center; justify-content: center;
  padding: max(12px, env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) max(12px, env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px));
}
.panel {
  background: linear-gradient(180deg, var(--iron-2), var(--iron)); border: 1px solid var(--line); border-radius: 4px;
  box-shadow: 0 0 0 1px rgba(201,162,74,.15), 0 30px 80px rgba(0,0,0,.6); max-height: 100%; overflow: auto;
}
.modal { width: min(500px, 100%); padding: 20px; }
.modal.wide-ish { width: min(720px, 100%); }
.modal h2, .town h2 { font-family: var(--f-display); margin: 0 0 10px; font-size: 24px; letter-spacing: .03em; text-wrap: balance; }
.modal-body p { margin: 0 0 10px; }
.modal-btns { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; margin-top: 14px; }
.modal-btns:empty { display: none; }
.uinfo { display: grid; grid-template-columns: 96px 1fr; gap: 14px; align-items: start; }
.uinfo img { width: 96px; height: 96px; background: rgba(0,0,0,.3); border-radius: 3px; }
.uinfo ul { margin: 4px 0; padding-left: 18px; }
.hint { color: var(--ash); font-size: 13px; margin: 6px 0 0; }
.help p { max-width: 70ch; }
.army-row h4 { margin: 8px 0 4px; font-weight: 600; color: var(--ash); text-transform: uppercase; letter-spacing: .06em; font-size: 13px; }
.army-row .slots { max-width: 460px; }

.town { width: min(1180px, 100%); padding: 18px 20px; display: flex; flex-direction: column; gap: 14px; }
.town-head { display: flex; gap: 16px; align-items: flex-start; flex-wrap: wrap; }
.town-head > div:first-child { flex: 1; min-width: 220px; }
.town-head h2 { margin: 0; }
.town-head p { margin: 4px 0 0; }
.eyebrow { text-transform: uppercase; letter-spacing: .14em; color: var(--brass); font-size: 12px; }
.town-res { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; font-variant-numeric: tabular-nums; }
.town h3 { font-family: var(--f-display); font-size: 14px; letter-spacing: .12em; color: var(--brass); margin: 0 0 8px; text-transform: uppercase; }
.town h3 small { font-family: var(--f-ui); letter-spacing: 0; text-transform: none; font-size: 14px; }
.town-cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); gap: 18px; }
.bgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px; }
.bcard { background: rgba(0,0,0,.22); border: 1px solid var(--line); border-radius: 3px; padding: 8px 10px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.bcard.built { border-color: #3d4a30; background: rgba(60,80,40,.12); }
.bcard.req { opacity: .6; }
.bc-top { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
.bcard p { margin: 0; color: var(--ash); font-size: 14px; }
.tag { font-size: 12px; color: var(--ash); text-align: right; }
.tag.ok { color: var(--ok); }
.costs { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; font-variant-numeric: tabular-nums; font-size: 14px; }
.cost { display: inline-flex; align-items: center; gap: 3px; }
.rlist { display: flex; flex-direction: column; gap: 6px; }
.rrow { display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; gap: 10px; align-items: center; background: rgba(0,0,0,.22); border: 1px solid var(--line); border-radius: 3px; padding: 6px 8px; }
.rrow.locked { opacity: .5; }
.rimg { background: none; border: 0; padding: 0; cursor: pointer; }
.rimg img { width: 64px; height: 64px; display: block; }
.rmid .mono { font-size: 13px; }
.rright { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.rq { display: flex; gap: 4px; align-items: center; }
.rq input { width: 58px; background: var(--soot); border: 1px solid var(--line); color: var(--bone); border-radius: 3px; padding: 4px 6px; font: inherit; font-variant-numeric: tabular-nums; }
.town-bottom { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 18px; border-top: 1px solid var(--line); padding-top: 12px; }
.market, .upgrade { margin-top: 12px; }
.upgrade h4 { margin: 0 0 4px; font-weight: 600; color: var(--ash); text-transform: uppercase; letter-spacing: .06em; font-size: 13px; }
.upgrade p { margin: 0 0 4px; }
.upgrade .btn { margin-top: 6px; }
.market h4 { margin: 0 0 6px; font-weight: 600; color: var(--ash); text-transform: uppercase; letter-spacing: .06em; font-size: 13px; }
.mrow { display: grid; grid-template-columns: 20px 60px auto auto; gap: 6px; align-items: center; margin-bottom: 4px; }

/* ---------- combat ---------- */
#combat {
  position: fixed; inset: 0; z-index: 40; background: var(--soot); display: grid; grid-template-rows: auto 1fr auto;
  padding: max(8px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(8px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  gap: 8px;
}
.cb-top { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 12px; align-items: center; }
.cb-side { min-width: 0; }
#cb-right { text-align: right; }
.cb-name { font-family: var(--f-display); font-size: 17px; border-bottom: 2px solid var(--side); display: inline-block; padding-bottom: 2px; }
.cb-stats { display: flex; gap: 10px; color: var(--ash); font-size: 13px; flex-wrap: wrap; font-variant-numeric: tabular-nums; margin-top: 3px; }
#cb-right .cb-stats { justify-content: flex-end; }
#cb-queue { display: flex; gap: 3px; overflow: hidden; max-width: 52vw; }
.q { position: relative; width: 38px; height: 38px; border: 2px solid var(--side); border-radius: 3px; background: rgba(0,0,0,.4); flex: none; }
.q.now { width: 48px; height: 48px; box-shadow: 0 0 0 1px var(--brass-hi); }
.q img { width: 100%; height: 100%; display: block; }
.q span { position: absolute; right: 1px; bottom: -1px; font-size: 11px; font-weight: 700; text-shadow: 0 1px 2px #000; }
.cb-stage { position: relative; min-height: 0; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
#cb-canvas { display: block; width: 100%; height: 100%; cursor: pointer; touch-action: manipulation; }
#cb-info {
  position: absolute; top: 10px; right: 10px; width: 220px; background: rgba(13,11,10,.94); border: 1px solid var(--line); border-radius: 3px; padding: 8px 10px; font-size: 14px; pointer-events: none;
}
.ci-head { display: flex; gap: 8px; align-items: center; border-bottom: 2px solid var(--side); padding-bottom: 6px; margin-bottom: 6px; }
.ci-head img { width: 44px; height: 44px; }
.ci-head span { display: block; color: var(--ash); font-size: 13px; }
#cb-info dl { display: grid; grid-template-columns: auto 1fr; gap: 1px 10px; margin: 0; font-variant-numeric: tabular-nums; }
#cb-info dt { color: var(--ash); } #cb-info dd { margin: 0; text-align: right; }
#cb-info ul { margin: 6px 0 0; padding-left: 16px; color: var(--ash); }
#cb-info .buff { color: #9fd0ff; }
#cb-spells { position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); width: min(420px, calc(100% - 20px)); padding: 10px; background: rgba(13,11,10,.96); border: 1px solid var(--line); border-radius: 4px; }
#cb-spells h4 { margin: 0 0 6px; font-family: var(--f-display); color: var(--brass); font-size: 14px; }
.spell-row { display: grid; grid-template-columns: 1fr auto; width: 100%; text-align: left; background: var(--iron-2); border: 1px solid var(--line); border-radius: 3px; padding: 6px 8px; margin-bottom: 4px; cursor: pointer; }
.spell-row:hover:not(:disabled) { border-color: var(--brass); }
.spell-row:disabled { opacity: .45; }
.spell-row small { grid-column: 1 / -1; color: var(--ash); }
.spell-row span { color: #c8c0ff; }
#cb-result {
  position: absolute; inset: 0; margin: auto; width: min(520px, calc(100% - 24px)); height: fit-content; max-height: calc(100% - 24px); overflow: auto;
  background: linear-gradient(180deg, var(--iron-2), var(--iron)); border: 1px solid var(--brass); border-radius: 4px; padding: 20px; text-align: center;
}
#cb-result h2 { font-family: var(--f-display); font-size: 36px; margin: 0 0 6px; letter-spacing: .1em; }
#cb-result h2.win { color: var(--brass-hi); } #cb-result h2.lose { color: #e0574a; }
.cas { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; text-align: left; margin: 12px 0; }
.cas h4 { margin: 0 0 6px; color: var(--ash); text-transform: uppercase; letter-spacing: .06em; font-size: 13px; }
.losses { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; }
.losses li { display: grid; grid-template-columns: 36px auto; align-items: center; gap: 4px; }
.losses img { width: 36px; height: 36px; }
.losses small { grid-column: 1 / -1; color: var(--ash); font-size: 12px; }
.xp { color: var(--brass-hi); }
.cb-bottom { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 12px; align-items: center; }
#cb-status { min-height: 22px; }
#cb-log { grid-column: 1; color: var(--ash); font-size: 13px; min-height: 18px; }
#cb-log div:not(:last-child) { display: none; }
.cb-btns { grid-column: 2; grid-row: 1 / span 2; display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }

/* ---------- title map options ---------- */
.map-opts { display: flex; gap: 22px; flex-wrap: wrap; justify-content: center; width: min(1100px, 100%); }
.mapgen { display: flex; gap: 26px; align-items: flex-start; width: 100%; background: rgba(20,16,12,.55); border: 1px solid var(--line); border-radius: 8px; padding: 16px 18px; }
.mg-opts { flex: 1; display: flex; flex-direction: column; gap: 14px; }
.mg-seed { width: 140px; background: var(--iron-2); color: inherit; border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; font: inherit; }
.mg-preview { margin: 0; text-align: center; }
.mg-preview canvas { width: 300px; height: 300px; border: 1px solid var(--brass); border-radius: 4px; image-rendering: pixelated; box-shadow: 0 6px 24px rgba(0,0,0,.6); }
.mg-preview figcaption { margin-top: 6px; font-size: 13px; color: var(--muted, #a89c88); }
.mg-legend h4 { margin: 0 0 4px; font-family: var(--f-display); color: var(--brass); font-size: 13px; letter-spacing: .12em; text-transform: uppercase; }
.mg-legend p { margin: 2px 0; font-size: 13px; }
.mg-legend i { display: inline-block; width: 11px; height: 11px; border: 1px solid #0c0a08; margin: 0 4px 0 8px; vertical-align: -1px; }
.mg-legend i:first-child { margin-left: 0; }
.opt-group { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; max-width: 520px; }
.opt-group h4 { width: 100%; margin: 0; font-family: var(--f-display); color: var(--brass); font-size: 13px; letter-spacing: .12em; text-transform: uppercase; }
.opt-group p { width: 100%; margin: 2px 0 0; font-size: 14px; }
.chip-btn { background: var(--iron-2); border: 1px solid var(--line); border-radius: 14px; padding: 4px 12px; cursor: pointer; }
.chip-btn.sel { border-color: var(--brass); color: var(--brass-hi); box-shadow: 0 0 0 1px var(--brass); }

/* ---------- hero card additions ---------- */
button.hc-head { background: none; border: 0; padding: 0; text-align: left; cursor: pointer; width: 100%; }
.ml { display: flex; gap: 10px; font-size: 13px; color: var(--ash); font-variant-numeric: tabular-nums; }

.tv-panel { padding: 10px 18px; flex: 1 1 auto; min-height: 44px; overflow: auto; border-top: 1px solid var(--line); }

.tv-bottom { flex: none; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr) auto; gap: 14px; padding: 12px 18px; border-top: 1px solid var(--line); background: rgba(0,0,0,.25); align-items: start; }
.tvb-head h2 { margin: 2px 0; font-size: 22px; }
.tvb-head p { margin: 0 0 6px; }

.tvb-face img { width: 100%; height: 100%; object-fit: cover; }

.tvb-face.crest { border-color: var(--line); } .tvb-face.crest img { object-fit: contain; }
.tvb-nav { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; min-width: 260px; align-content: start; }
.rrow.big { grid-template-columns: 96px minmax(0, 1fr) auto; }
.rrow.big .rimg img { width: 96px; height: 96px; }
.rrow.big p { margin: 3px 0; font-size: 14px; }
.guild { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
.glevel h4 { margin: 0 0 4px; color: var(--ash); font-size: 13px; text-transform: uppercase; letter-spacing: .06em; }
.glevel.locked { opacity: .5; }
.gspell { border: 1px solid var(--line); border-left: 3px solid var(--sc); border-radius: 3px; padding: 5px 7px; margin-bottom: 5px; background: rgba(0,0,0,.2); }
.gspell b { display: block; } .gspell small { color: var(--ash); } .gspell p { margin: 3px 0 0; font-size: 13px; }

.mrow { grid-template-columns: 20px 150px 40px auto auto; }

/* ---------- commander screen ---------- */

.aslot span { font-size: 11px; color: var(--ash); }

.aslot.picked { border-color: var(--brass-hi); }
.sl-head { grid-area: head; justify-self: center; } .sl-neck { grid-area: neck; } .sl-ring1 { grid-area: ring1; } .sl-ring2 { grid-area: ring2; }
.sl-weapon { grid-area: weapon; } .sl-shield { grid-area: shield; } .sl-cloak { grid-area: cloak; } .sl-armor { grid-area: armor; }
.sl-boots { grid-area: boots; } .sl-misc1 { grid-area: misc1; } .sl-misc2 { grid-area: misc2; } .sl-misc3 { grid-area: misc3; }
.pack { display: flex; flex-wrap: wrap; gap: 5px; }

.modal.levelup .modal-btns { flex-direction: column; align-items: stretch; }
.modal.levelup .btn { text-transform: none; letter-spacing: 0; text-align: left; font-size: 15px; }
.lvl-stat { font-family: var(--f-display); color: var(--brass-hi); font-size: 20px; }
#cb-info .debuff { color: #e06a50; }
img.avatar { object-fit: cover; object-position: center top; background: #1a1210; }

.info-box { background: var(--iron); border: 1px solid var(--line); border-radius: 4px; padding: 9px; display: flex; flex-direction: column; gap: 7px; }
.ib-top { display: grid; grid-template-columns: 74px minmax(0, 1fr); gap: 9px; align-items: start; }
.ib-face { width: 74px; height: 74px; border: 1px solid var(--brass); border-radius: 3px; overflow: hidden; padding: 0; cursor: pointer; background: #120e0c; }

/* ---------- town hall construction cards ---------- */

  background: none; border: 0; box-shadow: none; }

  filter: drop-shadow(0 20px 40px rgba(0,0,0,.8)); }
.th-title { position: absolute; left: 39.3%; top: 3.9%; width: 21.4%; height: 6.6%; display: grid; place-items: center; font-family: var(--f-display);
  color: var(--brass-hi); font-size: 2.1cqw; letter-spacing: .1em; text-transform: uppercase; text-shadow: 0 2px 3px #000; }
.th-area { position: absolute; left: 11%; top: 16%; width: 78%; height: 68%; display: flex; flex-direction: column; justify-content: space-around; }
.th-row { display: flex; justify-content: center; gap: 2.4cqw; }
.th-card { position: relative; width: 15.6cqw; aspect-ratio: 194 / 114; padding: 0; border: 0; cursor: pointer; color: inherit;
  background: url(assets/ui/townhall/card.webp) center / 100% 100% no-repeat; margin-bottom: 1.6cqw; transition: transform .12s, filter .12s; }
.th-card:hover { transform: translateY(-2px); filter: brightness(1.15) drop-shadow(0 0 8px rgba(236,201,110,.35)); }
.th-card.sel { filter: brightness(1.2) drop-shadow(0 0 10px rgba(236,201,110,.6)); }
.th-pic { position: absolute; left: 6%; top: 7%; width: 88%; height: 58%; display: grid; place-items: center; overflow: hidden; }

.th-card.today .th-pic img { filter: brightness(.7); }
.th-mark { position: absolute; right: 3%; top: 4%; width: 19%; filter: drop-shadow(0 2px 3px #000); }

.th-rib span { max-width: 78%; font-size: 1.12cqw; font-weight: 700; line-height: 1.05; text-align: center; color: #fff4dc; text-shadow: 0 1px 2px #000, 0 0 4px #000;
  overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.th-card.built .th-rib span { color: #2a1a04; text-shadow: 0 1px 0 rgba(255,240,180,.6); }
.th-bar { position: absolute; left: 30.4%; top: 89.2%; width: 40%; height: 8%; display: grid; place-items: center; font-size: 1.15cqw; color: var(--bone);
  text-shadow: 0 1px 2px #000; background: rgba(8,12,14,.82); border-radius: 2px; }

  background: linear-gradient(180deg, rgba(16,24,30,.97), rgba(8,12,16,.97)); border: 2px solid #9a7a3a; border-radius: 4px; box-shadow: 0 10px 40px rgba(0,0,0,.85); }
.th-dpic { display: grid; place-items: center; background: radial-gradient(ellipse at 50% 80%, #2a3a48, #0a1016); border: 1px solid #5a4a2a; }
.th-dpic img { max-width: 94%; max-height: 13cqw; object-fit: contain; }
.th-dtxt h4 { margin: 0 0 .4cqw; font-family: var(--f-display); color: var(--brass-hi); font-size: 1.7cqw; }
.th-dtxt p { margin: 0 0 .6cqw; font-size: max(12px, 1.1cqw); color: var(--ash); line-height: 1.3; }
.th-dtxt .costs { font-size: max(12px, 1.1cqw); margin-bottom: .6cqw; }
.th-why { color: #f0a090 !important; } .th-why.built { color: #a8e08a !important; }
.th-dbtn { display: flex; gap: 8px; margin-top: .4cqw; }
.tv-hint { margin: 4px 0; }
.fort-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

/* ---------- kingdom, week, barter ---------- */

.ktab img.mini { width: 26px; height: 26px; vertical-align: middle; } .ktab span { margin-right: 6px; white-space: nowrap; }
button.link { background: none; border: 0; padding: 0; color: var(--brass-hi); cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }

#stage, #hero-card, .adv-lists, .panel, .cb-stage, .mapgen, .fcard {
  position: relative;
  border: 3px solid transparent !important; border-radius: 3px !important;
  background-clip: padding-box;
  border-image: linear-gradient(180deg, #8a7038 0%, #4a3a20 40%, #2a2016 60%, #6a5228 100%) 1 !important;
  box-shadow: inset 0 0 0 1px #0c0907, inset 0 0 0 2px rgba(201,162,74,.22), inset 0 0 24px rgba(0,0,0,.55), 0 4px 18px rgba(0,0,0,.6);
}
#stage::after, #hero-card::after, .adv-lists::after, .panel::after, .cb-stage::after, .mapgen::after {
  content: ''; position: absolute; inset: 0; pointer-events: none; z-index: 5;
  background: var(--frame-tl) top left / 30px no-repeat, var(--frame-tr) top right / 30px no-repeat,
              var(--frame-br) bottom right / 30px no-repeat, var(--frame-bl) bottom left / 30px no-repeat;
}
.adv-lists { padding: 10px 12px 8px !important; }
#hero-card { padding: 12px !important; }
/* riveted iron strip along the top of large frames */
#stage::before, .panel.townv::before, .cb-stage::before {
  content: ''; position: absolute; left: 24px; right: 24px; top: 0; height: 3px; pointer-events: none; z-index: 5;
  background: radial-gradient(circle at 50% 50%, #f0d080 0 1px, #6e5220 1.6px, transparent 2px) 0 0 / 40px 3px repeat-x;
}
#minimap { border: 2px solid #6a5228 !important; box-shadow: 0 0 0 1px #0c0907, inset 0 0 12px rgba(0,0,0,.6); }
#topbar { border-bottom: 2px solid transparent !important; border-image: linear-gradient(90deg, transparent, #8a7038 12%, #c9a24a 50%, #8a7038 88%, transparent) 1 !important; }
.btn { background: linear-gradient(180deg, #2c2620, #1a1612); border: 1px solid #5a4828; box-shadow: inset 0 1px 0 rgba(255,220,150,.12), inset 0 -1px 0 rgba(0,0,0,.5); }
.btn.primary { background: linear-gradient(180deg, #e2c06a, #a8803a 60%, #8a6828); border-color: #3a2a10; box-shadow: inset 0 1px 0 rgba(255,245,200,.5), 0 1px 0 rgba(0,0,0,.6); }
.fcard.sel { border-image: linear-gradient(180deg, #f3d98a, #c9a24a 50%, #8a6828) 1 !important; }
.sets { display: grid; gap: 6px; margin-top: 4px; }
.setrow { display: flex; gap: 8px; align-items: center; padding: 4px 6px; border: 1px solid var(--line); border-radius: 4px; opacity: .8; }
.setrow img { width: 40px; height: 40px; }
.setrow.done { opacity: 1; border-color: #d8b040; box-shadow: 0 0 8px rgba(216,176,64,.35); }

/* ---------- cogitator terminal windows (painted frame + live elements) ---------- */
.term-overlay { display: grid; place-items: center; }
.term { position: relative; width: min(1240px, 96vw, calc(94vh * 1376 / 768)); aspect-ratio: 1376 / 768; background: center / 100% 100% no-repeat;
  container-type: inline-size; font-family: 'VT323', 'Courier New', monospace; color: #b4ff98; text-shadow: 0 0 .35cqw rgba(120,255,90,.7);
  filter: drop-shadow(0 1.5cqw 3cqw rgba(0,0,0,.8)); user-select: none; }
.term-rites { background-image: url(assets/ui/rites.webp); }
.term-commander { background-image: url(assets/ui/commander.webp); }
.term-scan { position: absolute; inset: 9% 9% 8% 9%; pointer-events: none; border-radius: 2cqw; overflow: hidden; z-index: 5; }
.term-scan::after { content: ''; position: absolute; left: 0; right: 0; height: 18%; top: -20%; background: linear-gradient(transparent, rgba(150,255,120,.05), transparent); animation: tscan 6s linear infinite; }
@keyframes tscan { to { top: 110%; } }
.term .t-el { position: absolute; box-sizing: border-box; margin: 0; padding: 0; border: 0; background: none; color: inherit; font: inherit; text-shadow: inherit; text-align: left; }
.term button.t-el { cursor: pointer; }
.term button.t-el:disabled { cursor: default; }
.t-title { display: flex; align-items: center; justify-content: center; font-size: 2.3cqw; letter-spacing: .12em; white-space: nowrap; overflow: hidden; }
.t-title span { font-size: 1.45cqw; opacity: .75; margin-left: .6em; letter-spacing: .05em; }
.t-desc { font-size: 1.32cqw; line-height: 1.15; overflow: hidden; display: flex; flex-direction: column; justify-content: center; }
.t-desc > div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.t-desc .t-sub { opacity: .85; }
.t-desc b { font-weight: normal; color: #e2ffd4; }
.t-desc span { opacity: .85; } .t-desc em { font-style: normal; color: #ffb070; text-shadow: 0 0 .3cqw rgba(255,140,60,.7); }
.t-btn { display: grid; place-items: center; text-align: center !important; font-size: 1.5cqw; letter-spacing: .1em; border-radius: .5cqw; }
.t-btn:hover:not(:disabled) { background: rgba(140,255,110,.12) !important; }
.t-btn.on, .t-go:not(:disabled) { background: rgba(140,255,110,.2) !important; box-shadow: 0 0 1cqw rgba(120,255,90,.45), inset 0 0 1cqw rgba(160,255,130,.4); color: #e8ffe0; }
.t-go { font-size: 1.9cqw; }
.t-go:disabled { opacity: .45; }
.t-tab { display: grid; place-items: center; border-radius: .5cqw; }
.t-tab img { width: 34%; opacity: .55; }
.t-tab:hover img { opacity: .85; }
.t-tab.on { background: rgba(140,255,110,.16) !important; box-shadow: 0 0 1.1cqw rgba(120,255,90,.5), inset 0 0 1cqw rgba(160,255,130,.45); }
.t-tab.on img { opacity: 1; }
.t-row { border-radius: .4cqw; }
.t-row:hover { background: rgba(140,255,110,.08) !important; }
.t-row.on { background: rgba(140,255,110,.22) !important; box-shadow: 0 0 1.2cqw rgba(120,255,90,.45), inset 0 0 1.4cqw rgba(170,255,140,.35); }
.t-row.off { opacity: .45; }
.t-ico { position: absolute; left: 2.3%; top: 12%; width: 12.6%; height: 77%; display: grid; place-items: center; }
.t-ico img { width: 78%; }
.t-ico b { position: absolute; right: 2%; bottom: -2%; font-weight: normal; font-size: 1.15cqw; background: #061006; padding: 0 .2cqw; line-height: 1; }
.t-rico { display: block; width: 100%; height: 100%; background-image: url(assets/ui/rite_icons.webp); background-repeat: no-repeat; mix-blend-mode: screen; }
.t-tab .t-rico { width: 62%; height: 80%; opacity: .6; }
.t-tab:hover .t-rico { opacity: .85; } .t-tab.on .t-rico { opacity: 1; }
.t-row.off .t-rico { filter: grayscale(.6); }
.t-name { position: absolute; left: 17%; right: 13%; top: 0; bottom: 0; display: flex; flex-direction: column; justify-content: center; font-size: 1.75cqw; line-height: 1; overflow: hidden; white-space: nowrap; }
.t-name.long { font-size: 1.45cqw; } .t-name.xlong { font-size: 1.2cqw; }
.t-name small { display: block; font-size: 1.05cqw; opacity: .7; letter-spacing: .08em; text-transform: uppercase; }
.t-cost { position: absolute; left: 89.4%; width: 7.5%; top: 29%; height: 41%; display: grid; place-items: center; font-size: 1.45cqw; }
.t-arrow:disabled { visibility: hidden; }
.t-dot { border-radius: 50%; }
.t-dot.on { background: #c8ffb0; box-shadow: 0 0 .8cqw #8fff70; }
.t-dot.gone { background: #0d1a0c; }
.t-x { border-radius: .5cqw; }
.t-x:hover { background: rgba(255,120,90,.18) !important; }
/* commander screen */
.t-por { object-fit: cover; opacity: .92; filter: sepia(.35) hue-rotate(50deg) saturate(1.3) brightness(.95); border-radius: .3cqw; }
.t-name-big { font-size: 2.8cqw; letter-spacing: .08em; display: flex; align-items: center; padding-left: 1.2% !important; white-space: nowrap; overflow: hidden; }
.t-line { font-size: 1.3cqw; display: flex; align-items: center; padding-left: .8% !important; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; opacity: .9; }
.term .t-stat-l { font-size: .82cqw; text-align: center !important; display: grid; place-items: center; color: #0b1a0a; text-shadow: none; letter-spacing: .08em; }
.t-stat-v { font-size: 2.1cqw; text-align: center !important; display: grid; place-items: center; }
.t-slot { display: grid; place-items: center; border-radius: .3cqw; }
.t-slot img { width: 92%; height: 92%; object-fit: contain; filter: drop-shadow(0 0 .3cqw rgba(0,0,0,.9)); }
.t-slot.full { background: rgba(4,12,4,.92) !important; box-shadow: inset 0 0 .8cqw rgba(120,255,90,.35); }
.t-slot:hover { box-shadow: 0 0 .9cqw rgba(120,255,90,.6), inset 0 0 .8cqw rgba(120,255,90,.4); }
.t-slot.fits { box-shadow: 0 0 1.2cqw rgba(255,220,90,.85), inset 0 0 1cqw rgba(255,220,90,.5); }
.t-slot.picked { box-shadow: 0 0 1.2cqw rgba(160,255,130,.95), inset 0 0 1cqw rgba(160,255,130,.6); }
.t-bag i { position: absolute; right: 6%; bottom: 0; font-style: normal; font-size: 1.1cqw; }
.t-set { display: flex; align-items: center; font-size: .98cqw; padding-left: 2% !important; white-space: nowrap; overflow: hidden; }
.t-set.done { color: #ffe9a0; text-shadow: 0 0 .5cqw rgba(255,210,90,.8); }
.t-seticon img { width: 100%; height: 100%; }
.t-tabtxt { background: none; border: 0; font: inherit; color: inherit; text-shadow: none; letter-spacing: inherit; cursor: pointer; padding: 0 .9cqw 0 0; opacity: .55; }
.t-tabtxt.on { opacity: 1; text-decoration: underline; text-underline-offset: .3cqw; }
.t-bio { font-size: 1.32cqw; line-height: 1.3; padding: .5cqw .8cqw !important; background: #050d05 !important; box-shadow: inset 0 0 1cqw rgba(120,255,90,.15); border-radius: .3cqw; overflow: auto; scrollbar-width: thin; }
.t-head { font-size: 1.55cqw; letter-spacing: .12em; display: flex; align-items: center; padding-left: 1.5% !important; color: #0b1a0a; text-shadow: none; }
.t-skill { display: flex; gap: 2%; font-size: 1.12cqw; align-items: center; padding: 0 1.5% !important; white-space: nowrap; overflow: hidden; }
.t-skill span { flex: 1; overflow: hidden; text-overflow: ellipsis; }
.t-skill.two { font-size: 1cqw; }
.t-skill small { opacity: .7; font-size: .95cqw; }
.t-spells { display: flex; flex-wrap: wrap; gap: .45cqw; align-content: flex-start; overflow: auto; padding: .4cqw !important; scrollbar-width: thin; scrollbar-color: #5fa84a transparent; }
.t-pill { border: .12cqw solid rgba(160,255,130,.75); border-radius: 3cqw; padding: .1cqw .9cqw; font-size: 1.15cqw; white-space: nowrap; box-shadow: 0 0 .4cqw rgba(120,255,90,.35); }
.t-pill.adv { background: rgba(140,255,110,.15); }
.t-cmd { font-size: 1.6cqw; letter-spacing: .1em; }
.t-holo { pointer-events: none; overflow: hidden; }
.t-holo::after { content: ''; position: absolute; left: 0; right: 0; height: 9%; top: -10%; background: linear-gradient(transparent, rgba(170,255,140,.16), transparent); animation: tscan 3.5s linear infinite; }

/* ---------- Recruitment Office ---------- */
.modal.dwell { width: min(560px, 94vw); }
.dw-top { display: flex; gap: 12px; align-items: stretch; }
.dw-build { width: 150px; flex: none; display: grid; place-items: center; border: 1px solid #5a4528; border-radius: 4px; background: radial-gradient(ellipse at 50% 80%, #3a2a24, #0e0908); }
.dw-build img { max-width: 94%; max-height: 130px; object-fit: contain; }
.dw-unit { width: 140px; flex: none; padding: 0; border: 2px solid #5a4528; border-radius: 4px; background: radial-gradient(ellipse at 50% 80%, #4a3a30, #120c0a); cursor: pointer; display: grid; place-items: center; }
.dw-unit:hover { border-color: var(--brass-hi); }
.dw-unit img { width: 132px; height: 132px; object-fit: contain; }
.dw-stats { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.dw-name { color: #e2c06a; font-size: 15px; } .dw-stats > small { margin-bottom: 3px; }
.dw-desc { margin: 10px 0 8px; font-size: .92em; }
.dw-counts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.dw-counts > div, .dw-cost > div { border: 1px solid var(--line); border-radius: 4px; background: rgba(0,0,0,.35); padding: 6px 10px; text-align: center; }
.dw-counts small, .dw-cost small { display: block; color: #b8ab92; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; }
